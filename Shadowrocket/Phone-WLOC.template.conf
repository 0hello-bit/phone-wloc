# 本地导入模板；response 脚本须先自行获取上游并构建，不能直接从本仓库下载。
[General]
dns-server = system

[Rule]
FINAL,DIRECT

[Script]
Phone WLOC Settings = type=http-request,pattern=^https?:\/\/gs-loc(?:-cn)?\.apple\.com\/wloc-settings\/save(?:\?.*)?$,requires-body=0,max-size=0,timeout=10,script-path=phone-wloc-settings.js
Phone WLOC Response = type=http-response,pattern=^https?:\/\/(?:gs-loc(?:-cn)?\.apple\.com|gsp-ssl\.ls\.apple\.com|bluedot\.is\.autonavi\.com(?:\.gds\.alibabadns\.com)?)\/clls\/wloc(?:\?.*)?$,requires-body=1,binary-body-mode=1,max-size=0,timeout=30,script-path=phone-wloc-response.js
[MITM]
enable = true
hostname = gs-loc.apple.com, gs-loc-cn.apple.com, gsp-ssl.ls.apple.com, bluedot.is.autonavi.com, bluedot.is.autonavi.com.gds.alibabadns.com
# 在小火箭中选择自己已安装并信任的 CA 证书。
